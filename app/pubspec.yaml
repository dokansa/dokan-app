name: dokan_app
description: تطبيق متجر دكان السعودية لمستلزمات الحيوانات الأليفة
publish_to: "none"
version: 1.0.0+34

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3
  cached_network_image: ^3.4.1
  google_fonts: ^6.2.1
  webview_flutter: ^4.10.0
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.6
  url_launcher: ^6.3.1
  html_unescape: ^2.0.0
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  flutter_widget_from_html_core: ^0.15.2
  image_picker: ^1.1.2
  smart_auth: ^3.2.0
  google_mlkit_barcode_scanning: '>=0.12.0 <1.0.0'
  google_mlkit_text_recognition: '>=0.13.0 <1.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.2

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/brand/
    - shorebird.yaml

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/icon_fg.png
  remove_alpha_ios: true
